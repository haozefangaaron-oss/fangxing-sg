<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>方行深港 · 司机端</title>
<meta name="theme-color" content="#f6f7f9" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{--bg:#f6f7f9;--card:#fff;--ink:#131a24;--muted:#6f7c8f;--line:#e7ebf1;--brand:#17406a;--brand-soft:#eef3f9;--gold:#a97c32;--gold-soft:#fbf4e6;--ok:#177a52;--ok-soft:#e9f6ef;--warn:#b45309;--warn-soft:#fdf2e4;--radius:16px;--shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px rgba(15,23,42,.06)}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(150deg,#265d90,#12324f);border:1px solid rgba(244,226,189,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .bn{font-size:15px;font-weight:600;line-height:1.2}
  .bs{font-size:10.5px;color:var(--muted);letter-spacing:1.4px}
  .me{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
  .me b{color:var(--ink);font-size:13px}
  main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
  .tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:rgba(255,255,255,.97);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b95a6;font-size:11px}
  .tabs button svg{width:20px;height:20px}
  .tabs button.on{color:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:12.5px;color:var(--muted)}
  .field input,.field select,.field textarea{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;outline:none;width:100%}
  .field textarea{height:80px;padding:10px 12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{height:46px;border-radius:12px;border:1px solid transparent;background:linear-gradient(160deg,#1f4f80,#143a5e);color:#fff;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--brand);border-color:var(--line)}
  .btn.gold{background:linear-gradient(160deg,#c39a58,#a97c32)}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45}
  .muted{color:var(--muted);font-size:12.5px}
  .pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.off{background:#f1f3f7;color:#8a94a6}
  .job{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:10px}
  .job .route{font-size:15px;font-weight:600}
  .job .meta{color:var(--muted);font-size:12.5px;margin-top:4px}
  .job .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
  .price{font-size:20px;font-weight:700;letter-spacing:.2px}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:12px;color:var(--muted)}
  .rules li{margin:6px 0}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(8px);padding:9px 16px;border-radius:999px;background:rgba(19,26,36,.92);color:#fff;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{color:var(--muted);font-size:13px;padding:12px 2px;text-align:center}
.logo .fg { font-size: 14px; font-weight: 700; color: #f4e2bd; line-height: 1; }
.logo .hk { position: absolute; right: 4px; bottom: 2px; font-size: 6px; color: rgba(244,226,189,.55); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="fg">FG</span><span class="hk">HK</span></div>
      <div><div class="bn">司机端 · 抢单池</div><div class="bs">FONGGO DRIVER</div></div>
    </div>
    <div class="me" id="meBox"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var CFG = { url: 'https://vxeimjdghscgdagqqoxf.supabase.co', key: 'sb_publishable_EYXhroVlwheCv1YmxSx_Qg_41Mq5WGz' };

  globalThis.__DRIVER_CFG__ = CFG; // 调试/测试用
  var SESSION = 'fx_driver_session_v1';
  var state = { view: 'auth', tab: 'pool', authMode: 'login', me: null, pool: [], mine: [], published: [], loading: false, ready: false, carOnline: false, isOwner: false };

  function $(s, r) { return (r || document).querySelector(s); }
  function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 1900); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function uid(p) { return (p || 'D') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function headers(extra) {
    var h = { apikey: CFG.key, 'Content-Type': 'application/json' };
    return Object.assign(h, extra || {});
  }
  function api(path, opts) {
    return fetch(CFG.url.replace(/\/$/, '') + '/rest/v1/' + path, Object.assign({ headers: headers() }, opts || {}))
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(r.status + ' ' + t.slice(0, 160)); });
        if (r.status === 204) return null;
        return r.text().then(function (t) {
          if (!t) return null;
          try { return JSON.parse(t); } catch (e) { return null; }
        });
      });
  }

  function hash(text) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    var h = 0, i;
    for (i = 0; i < text.length; i++) { h = (h * 31 + text.charCodeAt(i)) >>> 0; }
    return Promise.resolve('f' + h.toString(16));
  }

  /* ---------- 登录态 ---------- */
  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION) || 'null'); } catch (e) { return null; }
  }
  function saveSession(me) {
    state.me = me;
    try { localStorage.setItem(SESSION, JSON.stringify(me)); } catch (e) {}
  }
  function logout() {
    state.me = null;
    try { localStorage.removeItem(SESSION); } catch (e) {}
    state.view = 'auth';
    state.authMode = 'login';
    render();
  }

  /* ---------- 认证 ---------- */
  function renderAuth() {
    var isReg = state.authMode === 'register';
    return '<div class="card">' +
      '<h2>' + (isReg ? '司机注册' : '司机登录') + '</h2>' +
      '<div class="field"><label>手机号</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" /></div>' +
      (isReg ? '<div class="row2">' +
        '<div class="field"><label>姓名</label><input id="name" maxlength="10" placeholder="真实姓名" /></div>' +
        '<div class="field"><label>车牌</label><input id="plate" maxlength="12" placeholder="粤Z·XXXX港" /></div></div>' +
        '<div class="field"><label>微信号（方便联系）</label><input id="wechat" maxlength="30" placeholder="选填" /></div>' : '') +
      '<div class="field"><label>' + (isReg ? '设置 4 位数字密码' : '密码') + '</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4-8 位数字" /></div>' +
      '<button class="btn block" id="doAuth">' + (isReg ? '注册并登录' : '登录') + '</button>' +
      '<div class="empty"><a href="#" id="switchMode" style="color:#265f93">' + (isReg ? '已有账号？去登录' : '第一次来？注册司机账号') + '</a></div>' +
      '<div class="muted" style="text-align:center">注册后建议联系管理员核验车牌与两地牌</div>' +
      '</div>';
  }

  function doAuth() {
    var phone = ($('#phone') || {}).value || '';
    var pin = ($('#pin') || {}).value || '';
    if (!/^1\d{10}$/.test(phone.trim())) return toast('请填 11 位手机号');
    if (!/^\d{4,8}$/.test(pin.trim())) return toast('密码请用 4-8 位数字');
    var isReg = state.authMode === 'register';
    var name = (($('#name') || {}).value || '').trim();
    var plate = (($('#plate') || {}).value || '').trim();
    var wechat = (($('#wechat') || {}).value || '').trim();
    if (isReg && (!name || !plate)) return toast('请填姓名和车牌');

    hash(phone.trim() + '|' + pin.trim()).then(function (h) {
      if (isReg) {
        return api('drivers', { method: 'POST', headers: headers({ Prefer: 'return=representation' }), body: JSON.stringify({ id: uid('DR'), phone: phone.trim(), name: name, plate: plate, wechat: wechat, pwd: h, credit: 80, points: 0 }) })
          .then(function (rows) {
            var me = (rows && rows[0]) || {};
            saveSession({ id: me.id, name: me.name, plate: me.plate, credit: me.credit, points: me.points });
            state.view = 'app'; state.tab = 'pool'; render(); toast('注册成功，开始接单');
          });
      }
      return api('drivers?phone=eq.' + encodeURIComponent(phone.trim()) + '&select=*').then(function (rows) {
        var me = (rows || [])[0];
        if (!me) return toast('没有这个手机号，先注册');
        if (me.pwd !== h) return toast('密码不对');
        saveSession({ id: me.id, name: me.name, plate: me.plate, credit: me.credit, points: me.points });
        state.view = 'app'; state.tab = 'pool'; render();
      });
    }).catch(function (e) { toast('失败：' + e.message); });
  }

  /* ---------- 抢单池 ---------- */
  function loadPool() {
    state.loading = true; render();
    return api('pool_orders?status=eq.open&order=created_at.desc&limit=50')
      .then(function (rows) { state.pool = rows || []; state.loading = false; render(); })
      .catch(function (e) { state.loading = false; render(); toast('加载失败：' + e.message); });
  }

  function grab(job) {
    if (!state.me) return;
    if (!confirm('确认接这单？\n' + job.from_text + ' → ' + job.to_text + '\n' + job.when_text + ' · ¥' + job.price)) return;
    api('pool_orders?id=eq.' + encodeURIComponent(job.id) + '&status=eq.open', {
      method: 'PATCH',
      headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify({ status: 'taken', taker_id: state.me.id, taker_name: state.me.name, taken_at: new Date().toISOString() })
    }).then(function (rows) {
      if (!rows || !rows.length) { toast('手慢了，这单已被接走'); return loadPool(); }
      toast('抢到了，记得 15 分钟内联系客户');
      loadPool(); loadMine();
    }).catch(function (e) { toast('抢单失败：' + e.message); });
  }

  /* ---------- 发布 ---------- */
  function publish() {
    var from = (($('#pFrom') || {}).value || '').trim();
    var to = (($('#pTo') || {}).value || '').trim();
    var when = (($('#pWhen') || {}).value || '').trim();
    var price = Number((($('#pPrice') || {}).value || '0'));
    var seats = Number((($('#pSeats') || {}).value || '1'));
    var note = (($('#pNote') || {}).value || '').trim();
    if (!from || !to || !when) return toast('出发地、目的地、时间都要填');
    if (!price || price <= 0) return toast('请填价格');
    api('pool_orders', {
      method: 'POST', headers: headers({ Prefer: 'return=minimal' }),
      body: JSON.stringify({ id: uid('PO'), publisher_id: state.me.id, publisher_name: state.me.name, from_text: from, to_text: to, when_text: when, price: price, seats: seats, note: note, status: 'open' })
    }).then(function () {
      toast('已发布到抢单池');
      state.tab = 'pool'; render(); loadPool();
    }).catch(function (e) { toast('发布失败：' + e.message); });
  }

  /* ---------- 我的单 ---------- */
  function loadMine() {
    if (!state.me) return;
    Promise.all([
      api('pool_orders?taker_id=eq.' + encodeURIComponent(state.me.id) + '&order=created_at.desc&limit=50'),
      api('pool_orders?publisher_id=eq.' + encodeURIComponent(state.me.id) + '&order=created_at.desc&limit=50')
    ]).then(function (r) { state.mine = r[0] || []; state.published = r[1] || []; render(); })
      .catch(function () {});
  }

  function updateJob(job, patch, pointsDelta, creditDelta, reason) {
    api('pool_orders?id=eq.' + encodeURIComponent(job.id), { method: 'PATCH', headers: headers({ Prefer: 'return=minimal' }), body: JSON.stringify(patch) })
      .then(function () {
        if (pointsDelta || creditDelta) return api('points_log', {
          method: 'POST', headers: headers({ Prefer: 'return=minimal' }),
          body: JSON.stringify({ id: uid('PL'), driver_id: state.me.id, delta_points: pointsDelta || 0, delta_credit: creditDelta || 0, reason: reason || '' })
        }).then(function () {
          var next = { credit: Math.max(0, Math.min(100, (state.me.credit || 0) + (creditDelta || 0))), points: Math.max(0, (state.me.points || 0) + (pointsDelta || 0)) };
          return api('drivers?id=eq.' + encodeURIComponent(state.me.id), { method: 'PATCH', headers: headers({ Prefer: 'return=minimal' }), body: JSON.stringify(next) })
            .then(function () { saveSession(Object.assign({}, state.me, next)); });
        });
      })
      .then(function () { toast('已更新'); loadMine(); loadPool(); })
      .catch(function (e) { toast('操作失败：' + e.message); });
  }

  /* ---------- 渲染 ---------- */
  function jobs(list, opts) {
    if (!list.length) return '<div class="empty">' + (opts && opts.empty) + '</div>';
    return list.map(function (j) {
      var canGrab = opts.grab && j.status === 'open';
      return '<div class="job">' +
        '<div class="route">' + esc(j.from_text) + ' → ' + esc(j.to_text) + '</div>' +
        '<div class="meta">' + esc(j.when_text) + ' · ' + (j.seats || 1) + ' 人 · 发布 ' + esc(j.publisher_name || '') + '</div>' +
        (j.note ? '<div class="meta">备注：' + esc(j.note) + '</div>' : '') +
        '<div class="foot"><div class="price">¥' + (j.price || 0) + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
        (canGrab ? '<button class="btn gold" style="height:38px;padding:0 18px" data-grab="' + esc(j.id) + '">抢单</button>' : '<span class="pill ' + (j.status === 'done' ? 'ok' : j.status === 'cancelled' ? 'off' : 'warn') + '">' + (j.status === 'open' ? '待抢' : j.status === 'taken' ? '已接' : j.status === 'done' ? '已完成' : '已取消') + '</span>') +
        (opts.actions ? opts.actions(j) : '') +
        '</div></div></div>';
    }).join('');
  }

  function renderApp() {
    var tab = state.tab;
    var me = state.me || {};
    var lvl = me.points >= 2000 ? '钻石' : me.points >= 800 ? '金牌' : me.points >= 300 ? '银牌' : '铜牌';
    if (tab === 'pool') {
      return '<div class="stat"><div><b>' + (me.credit || 0) + '</b><span>信用分</span></div><div><b>' + (me.points || 0) + '</b><span>贡献分 · ' + lvl + '</span></div></div>' +
        '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">抢单大厅</h2><button class="btn ghost" style="height:32px;padding:0 12px;font-size:12.5px" id="refresh">刷新</button></div>' +
        '<div class="muted" style="margin:8px 0 12px">只有「待抢」的单可以接，手慢无。</div>' +
        (state.loading ? '<div class="empty">加载中…</div>' : jobs(state.pool, { grab: true, empty: '暂时没有可抢的单' })) + '</div>';
    }
    if (tab === 'publish') {
      return '<div class="card"><h2>发布订单</h2>' +
        '<div class="row2"><div class="field"><label>出发地</label><input id="pFrom" placeholder="如：深圳福田" /></div>' +
        '<div class="field"><label>目的地</label><input id="pTo" placeholder="如：香港尖沙咀" /></div></div>' +
        '<div class="field"><label>用车时间</label><input id="pWhen" placeholder="如：10月30日 09:30" /></div>' +
        '<div class="row2"><div class="field"><label>价格（元）</label><input id="pPrice" type="number" inputmode="numeric" placeholder="800" /></div>' +
        '<div class="field"><label>人数</label><input id="pSeats" type="number" inputmode="numeric" value="1" min="1" max="6" /></div></div>' +
        '<div class="field"><label>备注</label><textarea id="pNote" placeholder="行李、儿童座椅、通关口岸等"></textarea></div>' +
        '<button class="btn gold block" id="doPublish">发布到抢单池</button>' +
        '<div class="muted" style="margin-top:10px;text-align:center">发布免费；成交后由接单方支付 5% 平台服务费</div></div>' +
        '<div class="card"><h2>我发布的</h2>' + jobs(state.published, { empty: '还没发布过' }) + '</div>';
    }
    if (tab === 'mine') {
      return '<div class="card"><h2>我接的单</h2>' +
        jobs(state.mine, {
          empty: '还没接过单',
          actions: function (j) {
            if (j.status !== 'taken') return '';
            return '<button class="btn ghost" style="height:38px;padding:0 12px" data-done="' + esc(j.id) + '">完成</button>' +
              '<button class="btn ghost" style="height:38px;padding:0 12px;color:#b45309" data-cancel="' + esc(j.id) + '">取消</button>';
          }
        }) + '</div>';
    }
    return '<div class="card"><h2>我的账号</h2>' +
      '<div class="meta muted">' + esc(me.name || '') + ' · ' + esc(me.plate || '') + '</div>' +
      '<div class="stat" style="margin-top:12px"><div><b>' + (me.credit || 0) + '</b><span>信用分（0-100）</span></div><div><b>' + (me.points || 0) + '</b><span>贡献分</span></div></div>' +
      '<div style="margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div><b id="onlineState">' + (state.carOnline ? '出车中' : '未出车') + '</b><div class="muted" style="font-size:12px">出车后系统按你的位置派「现在用车」的单；保持页面打开，位置每 3 分钟更新</div></div>' +
      '<button class="btn ' + (state.carOnline ? 'ghost' : 'primary') + '" style="height:38px;padding:0 16px" id="toggleCar">' + (state.carOnline ? '收车' : '出车') + '</button>' +
      '</div>' +
      '<label class="switch" style="margin-top:10px;font-size:13px"><input type="checkbox" id="isOwner" ' + (state.isOwner ? 'checked' : '') + ' />我是车主（30 分钟内优先派给我）</label>' +
      '</div>' +
      '<button class="btn ghost block" id="logout" style="margin-top:12px">退出登录</button></div>' +
      '<div class="card rules"><h2>积分与抢单规则</h2>' +
      '<div class="muted" style="margin-bottom:8px">信用分（0-100）管能不能接单；贡献分（累计）管等级和优先权。</div>' +
      '<ul style="padding-left:18px;font-size:13.5px;line-height:1.9">' +
      '<li>完成一单：信用 +1（日上限 3）、贡献 +10</li>' +
      '<li>抢单后取消：距出发 &gt;4h −2 / 1–4h −5 / &lt;1h −12（信用）</li>' +
      '<li>爽约（客户投诉核实）：信用 −20、贡献 −50</li>' +
      '<li>迟到超 15 分钟：信用 −5</li>' +
      '<li>发布订单被他人接走：贡献 +8（鼓励共享运力）</li>' +
      '<li>发布虚假订单：信用 −10</li>' +
      '<li>信用 &lt;60：暂停抢单 7 天；&lt;40：暂停 30 天并人工复核</li>' +
      '<li>等级：铜（默认）→ 银 300 分 → 金 800 分 → 钻石 2000 分；等级越高每日可接单数越多、新单优先看</li>' +
      '</ul></div>';
  }

  function render() {
    var me = state.me;
    $('#meBox').innerHTML = me ? ('<b>' + esc(me.name || '') + '</b><br>' + esc(me.plate || '')) : '';
    var tabsEl = $('#tabs');
    if (!me) {
      tabsEl.style.display = 'none';
      $('#main').innerHTML = renderAuth();
      var sw = $('#switchMode');
      if (sw) sw.onclick = function (e) { e.preventDefault(); state.authMode = state.authMode === 'login' ? 'register' : 'login'; render(); };
      var btn = $('#doAuth');
      if (btn) btn.onclick = doAuth;
      return;
    }
    tabsEl.style.display = 'grid';
    tabsEl.innerHTML = [
      { id: 'pool', label: '抢单', d: '<path d="M4 7h16M4 12h10M4 17h7"/>' },
      { id: 'publish', label: '发布', d: '<path d="M12 5v14M5 12h14"/>' },
      { id: 'mine', label: '我的单', d: '<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/>' },
      { id: 'profile', label: '我的', d: '<circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>' }
    ].map(function (t) {
      return '<button class="' + (state.tab === t.id ? 'on' : '') + '" data-tab="' + t.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">' + t.d + '</svg>' + t.label + '</button>';
    }).join('');
    $('#main').innerHTML = renderApp();
  }

  /* ---------- 事件 ---------- */
  function carHeaders(extra) {
    return Object.assign({ apikey: CFG.key, 'Content-Type': 'application/json' }, extra || {});
  }
  function setOnline(on) {
    if (!state.me) return;
    var done = function (pos) {
      var row = {
        driver_id: state.me.id, name: state.me.name, plate: state.me.plate,
        lat: pos ? pos.lat : null, lng: pos ? pos.lng : null,
        online: on, priority: !!state.isOwner, updated_at: new Date().toISOString()
      };
      fetch(CFG.url + '/rest/v1/car_status', {
        method: 'POST',
        headers: carHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(row)
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        state.carOnline = on;
        if (on) {
          if (state.geoTimer) clearInterval(state.geoTimer);
          state.geoTimer = setInterval(function () {
            if (!state.carOnline || !navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(function (pp) {
              fetch(CFG.url + '/rest/v1/car_status', {
                method: 'POST',
                headers: carHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
                body: JSON.stringify({ driver_id: state.me.id, name: state.me.name, plate: state.me.plate, lat: pp.coords.latitude, lng: pp.coords.longitude, online: true, priority: !!state.isOwner, updated_at: new Date().toISOString() })
              }).catch(function () {});
            }, function () {}, { timeout: 8000 });
          }, 180000);
        } else if (state.geoTimer) {
          clearInterval(state.geoTimer);
          state.geoTimer = null;
        }
        render();
        toast(on ? '已出车，位置每 3 分钟更新' : '已收车');
      }).catch(function (e) { toast('失败：' + e.message + '（先跑 SETUP-即时派单.sql）'); });
    };
    if (!on) return done(null);
    if (!navigator.geolocation) return toast('这个浏览器不支持定位');
    navigator.geolocation.getCurrentPosition(
      function (p) { done({ lat: p.coords.latitude, lng: p.coords.longitude }); },
      function () { toast('没拿到定位权限，先打开定位再出车'); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'toggleCar') return setOnline(!state.carOnline);
    if (e.target.id === 'isOwner') {
      state.isOwner = e.target.checked;
      if (state.carOnline) setOnline(true);
      return;
    }
    var t = e.target.closest('[data-tab]');
    if (t) { state.tab = t.dataset.tab; render(); if (state.tab === 'mine') loadMine(); return; }
    var g = e.target.closest('[data-grab]');
    if (g) { var job = state.pool.filter(function (x) { return x.id === g.dataset.grab; })[0]; if (job) grab(job); return; }
    var d = e.target.closest('[data-done]');
    if (d) {
      var j = state.mine.filter(function (x) { return x.id === d.dataset.done; })[0];
      if (j) updateJob(j, { status: 'done', done_at: new Date().toISOString() }, 10, 1, '完成订单');
      return;
    }
    var c = e.target.closest('[data-cancel]');
    if (c) {
      var k = state.mine.filter(function (x) { return x.id === c.dataset.cancel; })[0];
      if (k && confirm('取消这单会被扣信用分，确定？')) updateJob(k, { status: 'cancelled' }, -15, -5, '抢单后取消');
      return;
    }
    if (e.target.id === 'refresh') return loadPool();
    if (e.target.id === 'doPublish') return publish();
    if (e.target.id === 'logout') return logout();
  });

  /* ---------- 启动 ---------- */
  var saved = loadSession();
  if (saved && saved.id) { state.me = saved; state.view = 'app'; }
  render();
  if (state.me) { loadPool(); loadMine(); }
})();
</script>
</body>
</html>
