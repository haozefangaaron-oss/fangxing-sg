<!DOCTYPE html>
<html lang="zh-Hans">
<head>

<title>方行深港 FONGGO · 工作日通勤班车 / 深港点对点包车</title>
<meta name="description" content="方行深港 FONGGO：工作日通勤班车（福田站12号出口 7:45 集合 → 香港IFC）与深港点对点跨境包车。7座埃尔法，每车限载5人，余位与票价实时可查。" />
<meta property="og:title" content="方行深港 FONGGO · 深港通勤 & 跨境包车" />
<meta property="og:description" content="工作日福田 → 香港IFC 通勤班车，余位与票价一目了然；深港点对点包车一口价，地点可搜索。" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #131a24; --ink-2: #3d4757; --muted: #6f7c8f;
    --line: #e7ebf1; --line-2: #eff2f7;
    --brand: #17406a; --brand-2: #265f93; --brand-soft: #eef3f9;
    --gold: #a97c32; --gold-soft: #fbf4e6;
    --ok: #177a52; --ok-soft: #e9f6ef;
    --warn: #b45309; --warn-soft: #fdf2e4;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px rgba(15, 23, 42, .06);
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.62 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid rgba(23,64,106,.35); outline-offset: 2px; }
  .app { height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; }

  .top {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line);
    backdrop-filter: saturate(180%) blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 38px; height: 38px; flex: 0 0 auto; position: relative;
    display: flex; align-items: center; justify-content: center;
    border-radius: 11px; background: linear-gradient(150deg, #265d90, #12324f);
    border: 1px solid rgba(244,226,189,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
  }
  .logo .fg { font-size: 15px; font-weight: 700; color: #f4e2bd; letter-spacing: .2px; line-height: 1; }
  .logo .hk { position: absolute; right: 4px; bottom: 3px; font-size: 6px; letter-spacing: .7px; color: rgba(244,226,189,.55); }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: .3px; line-height: 1.25; }
  .brand-sub { font-size: 10.5px; color: var(--muted); letter-spacing: 1.6px; }
  .icon-btn {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--brand); font-size: 12.5px; text-decoration: none; cursor: pointer;
  }
  .icon-btn svg { width: 14px; height: 14px; }
  .flow-top { display: flex; align-items: center; gap: 10px; }
  .back {
    width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    cursor: pointer; font-size: 19px; line-height: 1; color: var(--brand);
  }
  .flow-title { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .flow-step { font-size: 11px; color: var(--muted); letter-spacing: .5px; }

  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view { padding: 14px 16px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; line-height: 1.35; margin: 0; letter-spacing: -.2px; }
  h2 { font-size: 14px; margin: 0; letter-spacing: .2px; }
  p { margin: 0; }

  /* business cards */
  .biz { position: relative; border-radius: 20px; padding: 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; transition: transform .14s ease, box-shadow .14s ease; }
  .biz:active { transform: scale(.995); }
  .biz.tram { background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%); }
  .biz.charter { background: linear-gradient(180deg, #ffffff 0%, #fffaf1 100%); }
  .biz::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; }
  .biz.tram::before { background: linear-gradient(90deg, #1f4f80, #4a89c0); }
  .biz.charter::before { background: linear-gradient(90deg, #a97c32, #d9b877); }
  .biz-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .biz-title { font-size: 17px; font-weight: 650; letter-spacing: -.2px; }
  .biz-tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  .biz.charter .biz-tag { background: var(--gold-soft); color: var(--gold); }
  .tags { display: inline-flex; gap: 6px; align-items: center; }
  .biz-tag.alt { background: #eef7f1; color: #177a52; }
  .biz.charter .biz-tag.alt { background: #eef7f1; color: #177a52; }
  .now-bar { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin: 2px 0 14px; background: linear-gradient(135deg,#fff7e8,#fdf1d8); border: 1px solid #f0e0bf; border-radius: 18px; cursor: pointer; text-align: left; }
  .now-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #fff; border: 1px solid #f0e0bf; font-size: 16px; }
  .now-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
  .now-text b { font-size: 14.5px; }
  .now-text small { color: #8a6a2f; font-size: 12px; }
  .now-arrow { color: #b08a45; font-size: 20px; }
  .result-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: #fff; }
  .result-card.ok { border-color: #cfe8d9; background: #f6fdf9; }
  .result-card h3 { font-size: 16px; }
  .group { display: flex; align-items: center; gap: 16px; }
  .group-text { flex: 1 1 auto; min-width: 0; }
  .group-text h2 { font-size: 15px; margin: 0 0 4px; }
  .group-qr { flex: 0 0 auto; width: 96px; height: 96px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; overflow: hidden; }
  .group-qr img { width: 100%; height: 100%; object-fit: contain; }
  .group-qr .ph { display: none; text-align: center; font-size: 10px; color: var(--muted); line-height: 1.5; }
  .group-qr.missing img { display: none; }
  .group-qr.missing .ph { display: block; }
  .biz-route { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .biz-route .dash { flex: 1 1 auto; height: 1px; background: repeating-linear-gradient(90deg, #cfd8e4 0 5px, transparent 5px 9px); }
  .biz-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .fact { font-size: 11.5px; color: var(--muted); background: #f7f9fc; border: 1px solid var(--line-2); border-radius: 8px; padding: 4px 8px; }
  .biz-cta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .biz-price { font-size: 12px; color: var(--muted); }
  .biz-price b { font-size: 20px; color: var(--ink); font-weight: 650; letter-spacing: .2px; }
  .biz .btn { min-width: 132px; height: 42px; }

  .fold {
    margin-top: 12px; width: 100%; border: 1px dashed #dbe2ec; background: #fbfcfe;
    border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: var(--brand); cursor: pointer;
  }
  .fold .go { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
  .fold .chev { display: inline-block; transition: transform .18s ease; }
  .fold.open .chev { transform: rotate(90deg); }

  .btn {
    border: 1px solid transparent; border-radius: 13px; height: 46px; padding: 0 16px;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s ease, background .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: linear-gradient(160deg, #1f4f80, #143a5e); color: #fff; box-shadow: 0 6px 16px rgba(23,64,106,.18); }
  .btn.gold { background: linear-gradient(160deg, #c39a58, #a97c32); color: #fff; box-shadow: 0 6px 16px rgba(169,124,50,.2); }
  .btn.ghost { background: #fff; border-color: var(--line); color: var(--brand); }
  .btn.block { width: 100%; }
  .btn.small { height: 38px; font-size: 13px; border-radius: 11px; padding: 0 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .link { border: 0; background: none; color: var(--brand-2); font-size: 12.5px; padding: 0; cursor: pointer; }
  .nowrap { flex: 0 0 auto; white-space: nowrap; }

  .block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .block-head h2 { font-size: 14.5px; }
  .muted { color: var(--muted); font-size: 12.5px; }

  .trip { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; cursor: pointer; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: #fcfdfe; }
  .trip + .trip { margin-top: 8px; }
  .trip[disabled] { opacity: .62; cursor: not-allowed; }
  .trip-date { font-size: 13.5px; font-weight: 600; }
  .trip-date small { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
  .trip-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .trip-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
  .trip .s-price { font-size: 16px; }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.off { background: #f1f3f7; color: #8a94a6; }
  .pill.brand { background: var(--brand-soft); color: var(--brand); }
  .pill.gold { background: var(--gold-soft); color: var(--gold); }

  .step-head { padding: 2px 2px 0; }
  .step-head h2 { font-size: 19px; letter-spacing: -.2px; }
  .step-head p { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .progress { display: flex; gap: 5px; margin-top: 12px; }
  .progress i { height: 3px; flex: 1 1 0; border-radius: 2px; background: #e3e8f0; }
  .progress i.on { background: var(--brand); }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line);
    background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.03); cursor: pointer;
  }
  .opt b { display: block; font-size: 15px; font-weight: 600; }
  .opt small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .opt .chev { color: #b9c2d0; font-size: 18px; }

  .dates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .dates::-webkit-scrollbar { display: none; }
  .date-chip {
    flex: 0 0 auto; min-width: 74px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 9px 10px; border-radius: 13px; border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  .date-chip .wd { font-size: 11px; color: var(--muted); }
  .date-chip .dd { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
  .date-chip .left { font-size: 10.5px; }
  .date-chip[disabled] { opacity: .5; cursor: not-allowed; background: #fafbfc; }

  .seat-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
    cursor: pointer; text-align: left; box-shadow: 0 1px 2px rgba(15,23,42,.03);
  }
  .seat-card[disabled] { opacity: .5; cursor: not-allowed; background: #fafbfc; }
  .seat-card .s-name { font-size: 15px; font-weight: 600; }
  .seat-card .s-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .seat-right { display: flex; align-items: center; gap: 10px; }
  .s-price { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  .s-price small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 12.5px; color: var(--muted); }
  .field input {
    height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; font-size: 15px; color: var(--ink); outline: none; width: 100%;
  }
  .field input:focus, .field select:focus { border-color: #b9cee6; box-shadow: 0 0 0 3px rgba(23,64,106,.06); }
  .field select { height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; width: 100%; }
  .field-row { display: flex; gap: 8px; align-items: stretch; }
  .field-row input {
    flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 12px;
    border-radius: 11px; border: 1px solid var(--line); background: #fff;
    font-size: 14px; color: var(--ink); outline: none;
  }
  .field-row input:focus { border-color: #b9cee6; box-shadow: 0 0 0 3px rgba(23,64,106,.06); }

  .searchbox { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 0 12px; height: 48px; }
  .searchbox svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
  .searchbox input { flex: 1 1 auto; border: 0; outline: none; background: transparent; font-size: 15px; height: 46px; }
  .results { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .result {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line-2); background: #fff;
    text-align: left; cursor: pointer;
  }
  .result b { display: block; font-size: 14px; font-weight: 600; }
  .result small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .result .area { flex: 0 0 auto; font-size: 11px; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 2px 8px; }
  .picked { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 13px 14px; border-radius: 14px; background: var(--brand-soft); border: 1px solid #dbe7f2; }
  .picked b { font-size: 15px; }
  .picked .link { flex: 0 0 auto; white-space: nowrap; align-self: center; }
  .picked small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; }
  .chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }

  .summary { border-radius: 16px; border: 1px solid var(--line); background: #fff; overflow: hidden; box-shadow: var(--shadow); }
  .summary-head { padding: 12px 14px; font-size: 12px; letter-spacing: .6px; color: var(--brand); background: var(--brand-soft); border-bottom: 1px solid #e3ecf5; }
  .summary dl { margin: 0; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; }
  .summary dt { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .summary dd { margin: 0; text-align: right; font-size: 13.5px; word-break: break-word; }
  .summary .total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .summary .total b { font-size: 21px; color: var(--ink); letter-spacing: .3px; }

  .reminder { border-radius: 14px; padding: 13px 14px; background: var(--gold-soft); border: 1px solid #efdfc4; color: #7a5a1f; font-size: 13px; line-height: 1.65; }

  .success { text-align: center; padding: 8px 0 2px; }
  .success .mark { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); font-size: 26px; }
  .success h2 { font-size: 19px; }
  .success .no { margin-top: 8px; font-size: 20px; letter-spacing: 1.6px; font-weight: 650; color: var(--brand); font-variant-numeric: tabular-nums; }

  .rows { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 13.5px; }
  .row + .row { border-top: 1px solid var(--line-2); }
  .row b { font-weight: 600; color: var(--ink); }
  .row .sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .tabs {
    flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line); background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px); padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button { border: 0; background: transparent; cursor: pointer; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8b95a6; font-size: 11px; }
  .tabs button .ico { width: 21px; height: 21px; }
  .tabs button.on { color: var(--brand); }

  .stepper { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .stepper .label { font-size: 14px; }
  .stepper .label small { display: block; color: var(--muted); font-size: 11.5px; }
  .stepper .ctrl { display: flex; align-items: center; gap: 12px; }
  .stepper .ctrl button { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 17px; line-height: 1; cursor: pointer; }
  .stepper .ctrl span { min-width: 18px; text-align: center; font-size: 15px; font-weight: 600; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 14px; cursor: pointer; }
  .seg button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .seg a.btn { height: 46px; }

  .pay-method { text-align: center; font-size: 13px; color: var(--brand); font-weight: 600; letter-spacing: .6px; }
  .pay { border-radius: 16px; border: 1px solid var(--line); background: #fff; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
  .qr-wrap { display: grid; place-items: center; gap: 8px; }
  .qr { position: relative; width: 208px; height: 208px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }
  .qr img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .qr-fallback { display: none; text-align: center; color: var(--muted); font-size: 12px; padding: 16px; line-height: 1.7; }
  .qr.missing img { display: none; }
  .qr.missing .qr-fallback { display: block; }
  .pay-tip { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
  .qr { cursor: zoom-in; }
  .qr-zoom { position: absolute; right: 8px; bottom: 8px; font-size: 10.5px; color: #8a94a6; background: rgba(255,255,255,.9); border-radius: 999px; padding: 2px 8px; }
  .zoom-mask { position: fixed; inset: 0; background: rgba(8,12,20,.86); z-index: 80; display: grid; place-items: center; padding: 24px; }
  .zoom-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .zoom-box img { width: min(78vw, 380px); height: auto; border-radius: 16px; background: #fff; padding: 10px; }
  .zoom-tip { color: #fff; font-size: 13px; }

/** 把订单推到云端（Supabase）；失败就留在本机待同步队列，下次打开重试 */
function syncOrder(order) {
  const b = CONFIG.backend;
  if (!b || !b.url || !b.key) return Promise.resolve(false);
  const row = { id: order.id, type: order.type, payload: order, status: order.status || '待付款' };
  // 新版 sb_publishable_ 钥匙只需要 apikey 头；旧版 anon JWT 还要带 Authorization
  const headers = { 'apikey': b.key, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  if (!/^sb_publishable_/.test(b.key)) headers['Authorization'] = 'Bearer ' + b.key;
  return fetch(b.url.replace(/\/$/, '') + '/rest/v1/' + b.table, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(row)
  }).then((r) => {
    if (!r.ok) throw new Error('sync ' + r.status);
    const list = readPending().filter((o) => o.id !== order.id);
    writePending(list);
    return true;
  }).catch(() => {
    const list = readPending().filter((o) => o.id !== order.id);
    list.push(order);
    writePending(list);
    return false;
  });
}

/* charter */
function charterSteps() { return ['origin', 'dest', 'time', 'detail', 'confirm']; }

async function loadTripEta() {
  const d = S.draft || {};
  const a = d.originPlace && d.originPlace.loc;
  const b = d.destPlace && d.destPlace.loc;
  if (!a || !b || S.tripEta || S.tripEtaLoading) return;
  S.tripEtaLoading = true;
  render();
  const pa = a.split(',').map(Number), pb = b.split(',').map(Number);
  let done = null;
  const cross = sideOf(d.originArea) !== sideOf(d.destArea);
  if (!cross) {
    try {
      const url = 'https://restapi.amap.com/v3/direction/driving?key=' + CONFIG.amapKey +
        '&origin=' + a + '&destination=' + b + '&extensions=base';
      const j = await fetchJson(url, 6000);
      const p = (j.route && j.route.paths && j.route.paths[0]) || null;
      if (p) {
        const mins = Math.round(Number(p.duration) / 60);
        if (mins <= 150) done = { raw: Math.max(5, mins), km: Math.round(Number(p.distance) / 100) / 10, est: false };
      }
    } catch (e) {}
  }
  if (!done) {
    const km = kmBetween({ lat: pa[1], lng: pa[0] }, { lat: pb[1], lng: pb[0] });
    // 跨境：市区 25km/h + 15 分钟过关缓冲
    done = { raw: Math.max(12, Math.round(km * 2) + (cross ? 15 : 0)), km: Math.round(km * 10) / 10, est: true, cross: cross };
  }
  done.shown = done.raw + (CONFIG.etaBuffer || 0);
  S.tripEta = done;
  S.tripEtaLoading = false;
  render();
}

function fmtClock(mins) {
  const t = new Date(Date.now() + mins * 60000);
  return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
}

/* success + pay */
function getPos() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('不支持定位'));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      (e) => reject(e),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
}

async function fetchJson(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 6000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

function sideOf(code) { return String(code || '').indexOf('SZ') === 0 ? 'SZ' : (code ? 'HK' : ''); }

function kmBetween(a, b) {
  const R = 6371, rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function amapDrive(from, to) {
  const url = 'https://restapi.amap.com/v3/direction/driving?key=' + CONFIG.amapKey +
    '&origin=' + from.lng + ',' + from.lat + '&destination=' + to.lng + ',' + to.lat + '&extensions=base';
  try {
    const j = await fetchJson(url, 6000);
    const p = (j.route && j.route.paths && j.route.paths[0]) || null;
    if (p) {
      const mins = Math.round(Number(p.duration) / 60);
      const km = Number(p.distance) / 1000;
      // 跨境时高德会绕出十几小时，这种结果直接判为"到不了"
      if (mins > 150 || km > 80) return null;
      return Math.max(1, mins);
    }
  } catch (e) {}
  // 高德不通时按直线距离粗估（市区 25km/h）
  return Math.max(3, Math.round(kmBetween(from, to) * 2.4));
}

function mapZoneFromRegeo(j) {
  const c = (j.regeocode && j.regeocode.addressComponent) || {};
  const city = String(c.city || c.province || '');
  const district = String(c.district || '');
  if (city.indexOf('香港') >= 0) {
    if (/九龙|九龍|油尖|深水|旺角|黄大仙|觀塘|观塘/.test(district)) return 'HK_KOWLOON';
    if (/中西|湾仔|灣仔|东区|東區|南区|南區/.test(district)) return 'HK_ISLAND';
    if (/机场|機場|赤鱲角/.test(district)) return 'HK_AIRPORT';
    return 'HK_NEW';
  }
  if (/福田|罗湖|羅湖|南山|盐田|鹽田/.test(district)) return 'SZ_CITY';
  if (/宝安|寶安/.test(district)) return 'SZ_AIRPORT';
  return 'SZ_OTHER';
}

async function regeoZone(pos) {
  try {
    const url = 'https://restapi.amap.com/v3/geocode/regeo?key=' + CONFIG.amapKey + '&location=' + pos.lng + ',' + pos.lat;
    const j = await (await fetch(url)).json();
    return mapZoneFromRegeo(j);
  } catch (e) { return null; }
}

async function sbReq(path, opts) {
  const url = CONFIG.backend.url.replace(/\/$/, '') + '/rest/v1/' + path;
  const r = await fetch(url, Object.assign({ headers: { apikey: CONFIG.backend.key, 'Content-Type': 'application/json' } }, opts || {}));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function dispatchNow() {
  S.now.status = 'loading';
  render();
  try {
    const pos = await getPos();
    let minutes = 30;
    try {
      const cfgRows = await sbReq('settings?key=eq.dispatch&select=value');
      if (cfgRows && cfgRows[0] && cfgRows[0].value && cfgRows[0].value.priorityMinutes) minutes = Number(cfgRows[0].value.priorityMinutes);
    } catch (e) {}
    const pickupZone = await regeoZone(pos);
    const price = pickupZone ? zoneQuote(pickupZone, S.now.dest) : null;
    let cars = [];
    try {
      cars = await sbReq('car_status?online=eq.true&select=*&order=priority.desc') || [];
    } catch (e) { cars = []; }
    const now = Date.now();
    cars = cars.filter((c) => c.lat && c.lng && (!c.busy_until || new Date(c.busy_until).getTime() < now));

    let assigned = null;
    for (const c of cars) {
      if (!c.priority) continue;
      const eta = await amapDrive(pos, { lat: c.lat, lng: c.lng });
      if (eta != null && eta <= minutes) { assigned = { car: c, eta: eta }; break; }
    }

    const zone = S.now.dest;
    if (assigned) {
      const orderId = 'IS' + Date.now().toString(36).toUpperCase();
      try {
        await sbReq('orders', {
          method: 'POST',
          headers: { apikey: CONFIG.backend.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({
            id: orderId, type: '跨境包车', status: '待付款',
            payload: { mode: 'instant', destArea: zone, car: assigned.car.name, plate: assigned.car.plate, eta: assigned.eta, pickup: pos, pickupZone: pickupZone, price: price, source: '立即用车' }
          })
        });
        await sbReq('car_status?driver_id=eq.' + encodeURIComponent(assigned.car.driver_id), {
          method: 'PATCH',
          headers: { apikey: CONFIG.backend.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ busy_until: new Date(Date.now() + 90 * 60000).toISOString() })
        });
      } catch (e) {}
      S.now.result = { kind: 'owner', car: assigned.car, eta: assigned.eta, orderId: orderId, price: price };
    } else {
      const orderId = 'IS' + Date.now().toString(36).toUpperCase();
      try {
        await sbReq('pool_orders', {
          method: 'POST',
          headers: { apikey: CONFIG.backend.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({
            id: orderId, publisher_id: 'SYSTEM', publisher_name: '现在用车',
            from_text: '客户当前位置',
            to_text: ZONE_LABEL[zone], when_text: '现在 · 90 分钟内', price: price || 0, seats: 1,
            note: '⚡ 现在用车 · ' + (pickupZone ? ZONE_LABEL[pickupZone] : '位置待确认') + ' 上车' + (price ? '，已按区域价出价' : '，价格客服确认'), status: 'open'
          })
        });
      } catch (e) {}
      S.now.result = { kind: 'pool', orderId: orderId, price: price, pickupZone: pickupZone };
    }
    S.now.status = 'done';
  } catch (e) {
    S.now.status = 'done';
    const denied = e && (e.code === 1 || /denied|权限/i.test(e.message || ''));
    S.now.result = denied ? { kind: 'nogeo' } : { kind: 'none', err: e.message };
  }
  render();
}

globalThis.__FONGGO_DEBUG__ = { S: S, render: render, loadTripEta: loadTripEta };

/* nav */
function go(view) {
  S.view = view; S.step = 0; S.draft = {}; S.order = null; S.q = ''; S.results = [];
  if (['home', 'price', 'me'].includes(view)) S.tab = view;
  render();
}
function back() {
  if (S.step > 0) { S.step--; S.q = ''; S.results = []; render(); return; }
  go('home');
}
function openSuccess(order) { S.order = order; S.view = 'done'; S.tab = 'home'; S.payTab = 'wechat'; S.sheet = null; render(); }

function submitBusInfo() {
  const form = document.querySelector('[data-form]');
  if (!form) return;
  const nameEl = form.querySelector('[name=name]');
  const phoneEl = form.querySelector('[name=phone]');
  const name = ((nameEl && nameEl.value) || '').trim();
  const phone = ((phoneEl && phoneEl.value) || '').trim();
  if (name.length < 1 || name.length > 20) return toast('请填写乘车人姓名');
  const digits = phone.replace(/\D/g, '');
  if (digits.length < 8 || digits.length > 15) return toast('请检查联系电话');
  S.draft.name = name;
  S.draft.phone = phone.replace(/\s+/g, '');
  S.step += 1;
  render();
}

function submitBus() {
  const d = S.draft;
  const seat = SEAT_BY_ID[d.seat];
  const order = {
    id: newOrderId('FX'), type: '通勤班车', direction: d.direction, date: d.date,
    seat: seat.name, price: seat.price,
    dropoff: d.dropoff || '',
    dropoffAddr: d.dropoff === '家门口' && d.homePlace ? (d.homePlace.name + (d.homePlace.addr ? ' ' + d.homePlace.addr : '')) : '',
    name: d.name, phone: d.phone, status: '待付款', createdAt: new Date().toISOString()
  };
  saveOrder(order);
  rememberPax({ name: d.name, phone: d.phone });
  syncOrder(order);
  S.agreed = false;
  openSuccess(order);
}

function submitCharter() {
  const d = S.draft;
  const order = {
    id: newOrderId('PV'), type: '跨境包车',
    origin: d.originPlace ? d.originPlace.name : '',
    destination: d.destPlace ? d.destPlace.name : '',
    originAddr: d.originPlace ? d.originPlace.addr : '',
    destAddr: d.destPlace ? d.destPlace.addr : '',
    when: `${d.date} ${d.time}`, pax: d.pax || 1, childseat: !!d.childseat,
    bags: d.bags == null ? 1 : d.bags,
    price: quoteByArea(d.originArea, d.destArea),
    status: '待客服确认', createdAt: new Date().toISOString()
  };
  saveOrder(order);
  syncOrder(order);
  S.agreed = false;
  openSuccess(order);
}

/* actions */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const val = el.dataset.val;

  if (act === 'tab' || act === 'go') return go(val);
  if (act === 'back') return back();
  if (act === 'toggle-trips') { S.showTrips = !S.showTrips; render(); return; }
  if (act === 'clear-orders') { clearOrders(); render(); return toast('已清除本机记录'); }
  if (act === 'copy-wx') return copy(CONFIG.contact.wechat);
  if (act === 'copy-order') return copy(val);
  if (act === 'call') { location.href = 'tel:' + CONFIG.contact.phone; return; }
  if (act === 'paytab') { S.payTab = val; render(); return; }
  if (act === 'now-open') { S.now = { dest: 'HK_KOWLOON', status: 'idle', result: null }; S.view = 'now'; render(); return; }
  if (act === 'now-back') { S.view = 'home'; render(); return; }
  if (act === 'now-go') { dispatchNow(); return; }
  if (act === 'now-pay') { toast('请加客服微信付款，付完截图核对'); return; }
  if (act === 'pq-go') {
    const a = S.pq.from, b = S.pq.to;
    if (!zoneQuote(a, b)) return toast('该线路需人工报价');
    S.draft = {
      originPlace: { name: ZONE_LABEL[a], addr: '', cat: a },
      destPlace: { name: ZONE_LABEL[b], addr: '', cat: b },
      originArea: a, destArea: b
    };
    S.view = 'charter';
    S.step = 2;
    render();
    return;
  }
  if (act === 'zoom-qr') {
    const src = S.payTab === 'alipay' ? CONFIG.pay.alipay : CONFIG.pay.wechat;
    S.zoom = { src: src };
    render();
    return;
  }
  if (act === 'zoom-close') { S.zoom = null; render(); return; }
  if (act === 'save-qr') {
    // 浏览器里触发图片下载，用户可在相册/下载里找到
    const src = val === 'alipay' ? CONFIG.pay.alipay : CONFIG.pay.wechat;
    const a = document.createElement('a');
    a.href = src; a.download = val === 'alipay' ? 'fonggo-alipay.png' : 'fonggo-wechat.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('已保存，去相册/下载里找');
    return;
  }

  if (act === 'pick-date') {
    const dt = parseISO(val);
    if (!isOperating(dt) || !bookable(dt) || seatsLeft(availability(val, '去程')) === 0) return toast('这个班次不可预约');
    S.view = 'bus'; S.draft = { direction: '去程', date: val }; S.step = 2; render();
    return;
  }

  if (act === 'bus-dir') { S.draft.direction = val; S.step = 1; render(); return; }
  if (act === 'bus-date') { S.draft.date = val; S.step = 2; render(); return; }
  if (act === 'bus-date-other') {
    const v = ($('#otherDate') || {}).value;
    if (!v) return toast('请先选一个日期');
    const dt = parseISO(v);
    if (!isOperating(dt)) return toast('该日是周末或公众假期，班车停运');
    if (!bookable(dt)) return toast('已过前一日 20:00 截止时间');
    if (seatsLeft(availability(v, S.draft.direction)) === 0) return toast('该日已满，换一天试试');
    S.draft.date = v; S.step = 2; render(); return;
  }
  if (act === 'bus-seat') { S.draft.seat = val; S.step += 1; render(); return; }
  if (act === 'bus-drop') { S.draft.dropoff = val; S.step += 1; render(); return; }
  if (act === 'bus-info-next') return submitBusInfo();
  if (act === 'bus-submit') return submitBus();

  if (act === 'pick-origin' || act === 'pick-dest' || act === 'pick-home') {
    const parts = String(val).split('|');
    const place = { name: parts[0] || '', addr: parts[1] || '', cat: parts[2] || '', loc: parts[3] || '' };
    if (!place.name) return;
    const kind = act.replace('pick-', '');
    S.draft[kind + 'Place'] = place;
    S.draft[kind + 'Area'] = place.cat || guessArea(place);
    pushRecent(place);
    S.q = ''; S.results = []; S.tripEta = null; S.tripEtaLoading = false;
    render();
    return;
  }
  if (act === 'clear-place') {
    S.draft[val + 'Place'] = null;
    S.draft[val + 'Area'] = null;
    S.q = ''; S.results = []; S.tripEta = null; S.tripEtaLoading = false;
    render();
    return;
  }
  if (act === 'set-area') {
    const parts = String(val).split(':');
    S.draft[parts[0] + 'Area'] = parts[1];
    render();
    return;
  }
  if (act === 'place-next') {
    if (!S.draft[val + 'Place']) return toast('请先选择地点');
    if (val !== 'home' && !S.draft[val + 'Area']) return toast('请选择所属区域');
    S.step += 1; S.q = ''; S.results = [];
    render();
    return;
  }
  if (act === 'manual-origin' || act === 'manual-dest' || act === 'manual-home') {
    const kind = act.replace('manual-', '');
    const v = (($('#manualPlace') || {}).value || '').trim();
    if (!v) return toast('请填写地点');
    const place = { name: v, addr: '', cat: guessArea({ name: v, addr: '' }) };
    S.draft[kind + 'Place'] = place;
    S.draft[kind + 'Area'] = place.cat;
    pushRecent(place);
    S.q = ''; S.results = [];
    render();
    return;
  }
  if (act === 'geo') {
    const kind = val;
    if (!navigator.geolocation) return toast('此设备不支持定位，请手动填写地点');
    toast('正在获取位置…');
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      let place = { name: '我的当前位置', addr: lat.toFixed(5) + ', ' + lng.toFixed(5), cat: 'OTHER' };
      if (CONFIG.amapKey) {
        try {
          const url = 'https://restapi.amap.com/v3/geocode/regeo?key=' + encodeURIComponent(CONFIG.amapKey) +
            '&location=' + lng + ',' + lat + '&extensions=base';
          const j = await (await fetch(url)).json();
          if (j && j.status === '1' && j.regeocode && j.regeocode.formatted_address) {
            const addr = j.regeocode.formatted_address;
            place = { name: (j.regeocode.pois && j.regeocode.pois[0] && j.regeocode.pois[0].name) || '当前位置', addr, cat: '' };
            place.cat = guessArea({ name: place.name, addr });
          }
        } catch (err) {}
      }
      place.loc = lng + ',' + lat;
      S.tripEta = null; S.tripEtaLoading = false;
      S.draft[kind + 'Place'] = place;
      S.draft[kind + 'Area'] = place.cat;
      pushRecent(place);
      render();
      if (place.cat === 'OTHER') toast('已定位，请确认所属区域');
    }, () => toast('定位失败，请手动填写地点'), { timeout: 8000 });
    return;
  }

  if (act === 'charter-time') {
    const date = ($('#charterDate') || {}).value;
    const time = ($('#charterTime') || {}).value;
    if (!date) return toast('请选择用车日期');
    if (parseISO(date) < startOfDay(new Date())) return toast('用车日期不能早于今天');
    if (!time) return toast('请选择具体时间');
    S.draft.date = date; S.draft.time = time; S.step += 1; render(); return;
  }
  if (act === 'pax') { S.draft.pax = Math.max(1, Math.min(6, (S.draft.pax || 1) + Number(val))); render(); return; }
  if (act === 'bags') { S.draft.bags = Math.max(0, Math.min(8, (S.draft.bags == null ? 1 : S.draft.bags) + Number(val))); render(); return; }
  if (act === 'childseat') { S.draft.childseat = val === '1'; render(); return; }
  if (act === 'charter-detail') { S.step += 1; render(); return; }
  if (act === 'charter-submit') return submitCharter();

  if (act === 'mark-paid') {
    if (!S.order) return;
    const list = updateOrder(S.order.id, { status: '已付款待核对' });
    S.order = list.find((o) => o.id === S.order.id) || S.order;
    render();
    toast('已记录，客服核对后会确认占位');
    return;
  }
  if (act === 'open-terms') { S.sheet = 'terms'; render(); return; }
  if (act === 'close-sheet') { S.sheet = null; render(); return; }
  if (act === 'agree-pay') {
    S.agreed = true;
    S.sheet = null;
    render();
    return;
  }

  if (act === 'open-pay') {
    const o = loadOrders().find((x) => x.id === val);
    if (o) openSuccess(o);
    return;
  }
  if (act === 'refund-info') {
    toast('班车退票：20:00 前可退；之后仅候补，候补成功才退款');
    return;
  }
  if (act === 'charter-change') {
    toast('包车改期／取消请联系客服 ' + CONFIG.contact.phone);
    return;
  }
});

/* place search（防抖，只更新结果区，不重建输入框） */
let searchTimer = null;
let searchSeq = 0;
document.addEventListener('input', (e) => {
  if (!e.target || e.target.id !== 'placeSearch') return;
  const q = e.target.value;
  S.q = q;
  clearTimeout(searchTimer);
  const box = document.getElementById('placeResults');
  if (!q.trim()) {
    S.results = [];
    S.searching = false;
    if (box) box.innerHTML = resultsHTML(placeKind());
    return;
  }
  S.results = [];
  S.searching = true;
  if (box) box.innerHTML = resultsHTML(placeKind());
  const seq = ++searchSeq;
  searchTimer = setTimeout(async () => {
    let results = null;
    try { results = await searchAmap(q); } catch (err) { results = null; }
    if (seq !== searchSeq) return;
    S.results = (results && results.length) ? results : searchLocal(q);
    S.searching = false;
    const live = document.getElementById('placeResults');
    if (live) live.innerHTML = resultsHTML(placeKind());
  }, 280);
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const name = (form.querySelector('[name=name]').value || '').trim();
  const phone = (form.querySelector('[name=phone]').value || '').trim();
  if (name.length < 1 || name.length > 20) return toast('请填写乘车人姓名');
  const digits = phone.replace(/\D/g, '');
  if (digits.length < 8 || digits.length > 15) return toast('请检查联系电话');
  S.draft.name = name;
  S.draft.phone = phone.replace(/\s+/g, '');
  S.step += 1;
  render();
});

checkPayImages();
flushPending();
render();
</script>
</body>
</html>
